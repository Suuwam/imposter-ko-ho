<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Imposter Ko Ho?</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--line:#d9dcef;--red:#dc143c;--blue:#2d5bd8;--txt:#14162e;--mut:#5d6290;--gold:#a86e00;--btn:#eceefa;--chip:#f7f8fe;--inp:#fff;--chipon:#ffe3ea;--f1:#e6e9fb;--f2:#dde1f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,"Noto Sans Devanagari",sans-serif}
#app{min-height:100%;max-width:520px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px}
h1{margin:4px 0 0;font-size:34px;line-height:1.1;text-align:center}
h1 span{color:var(--red)}
h2{margin:0;font-size:15px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sub{text-align:center;color:var(--mut);margin:0}
.top{display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;font-weight:700}
.seg button.on{background:var(--red);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px;font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--txt);font-size:22px;font-weight:700}
.step b{min-width:34px;text-align:center;font-size:22px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:2px solid var(--line);background:var(--chip);color:var(--txt);border-radius:14px;padding:14px 10px;font:inherit;font-weight:700;font-size:15px;text-align:left}
.chip i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.chip.on{border-color:var(--red);background:var(--chipon)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--txt);font:inherit;font-size:15px;user-select:text}
.tog{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.tog input{width:24px;height:24px;accent-color:var(--red)}
.btn{border:0;border-radius:16px;padding:18px;font:inherit;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--red),#a3102f);box-shadow:0 6px 0 #6d0b20;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6d0b20}
.btn.alt{background:linear-gradient(135deg,var(--blue),#1d3c99);box-shadow:0 6px 0 #142a6b}
.btn.ghost{background:none;box-shadow:none;border:1px solid var(--line);color:var(--mut);font-size:16px;padding:14px}
.grow{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.big{font-size:28px;font-weight:800;margin:0}
.flip{width:100%;perspective:1000px;height:340px;touch-action:none;-webkit-touch-callout:none}
.flip>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.open>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;border:2px solid var(--line)}
.front{background:repeating-linear-gradient(45deg,var(--f1),var(--f1) 14px,var(--f2) 14px,var(--f2) 28px)}
.front .q{font-size:90px}
.back{transform:rotateY(180deg);background:var(--card)}
.back.imp{background:radial-gradient(circle at 50% 30%,#5a0d22,#20091a);border-color:var(--red);color:#fff}
.word{font-size:36px;font-weight:900;line-height:1.15}
.word small{display:block;font-size:20px;color:var(--mut);font-weight:700;margin-top:6px}
.timer{font-size:82px;font-weight:900;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.pill{display:inline-block;background:var(--btn);border-radius:99px;padding:8px 14px;font-weight:700;margin:4px}
.pill.r{background:var(--red);color:#fff}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--red)}
.top .dots{gap:8px}.top .dots span{width:28px;height:8px;border-radius:99px}
.names input{padding:14px 12px;font-size:16px}
.seg-b{background:var(--btn);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;font-size:14px}
#splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
#splash .logo{width:min(72vw,320px);aspect-ratio:1;border-radius:50%;box-shadow:0 10px 40px rgba(220,20,60,.45);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px) rotate(-3deg)}}
.bar{width:70%;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:99px;animation:fill 7s ease-out forwards}
@keyframes fill{to{width:100%}}
.err{color:var(--gold);text-align:center;font-weight:700;min-height:1em;margin:0}
</style>
</head>

  tag:['Sathi haru sanga khelnuhos, imposter lai chinnuhos!','साथीहरूसँग खेल्नुहोस्, इम्पोस्टरलाई चिन्नुहोस्!'],
  players:['Kheladi','खेलाडी'], imps:['Imposter','इम्पोस्टर'], time:['Samaya (min)','समय (मिनेट)'],
  cats:['Bishaya','विषय'], names:['Kheladi ko naam','खेलाडीको नाम'], hint:['Imposter lai bishaya dekhaunuhos','इम्पोस्टरलाई विषय देखाउनुहोस्'], clue:['Imposter lai close hint dinuhos','इम्पोस्टरलाई नजिकको हिन्ट दिनुहोस्'], cl:['Hint','हिन्ट'],
  start:['Khel Suru Garnuhos','खेल सुरु गर्नुहोस्'], pick:['Kamti ma ek bishaya chhannuhos!','कम्तीमा एउटा विषय छान्नुहोस्!'],
  p:['Kheladi','खेलाडी'], pass:['Phone {n} lai dinuhos','फोन {n}लाई दिनुहोस्'], tap:['Herna thichirakhnuhos','हेर्न थिचिराख्नुहोस्'], seen:['Herisaknu bhayo ✓','हेरिसक्नुभयो ✓'],
  only:['Aru le naherun hai! 👀','अरूले नहेरून् है! 👀'], your:['Tapai ko shabda','तपाईंको शब्द'],
  you:['Tapai Imposter Hunuhunchha!','तपाईं इम्पोस्टर हुनुहुन्छ!'], blend:['Kasaile thaha napaos 🤫','कसैले थाहा नपाओस् 🤫'],
  cat:['Bishaya','विषय'], next:['Lukaunuhos ra arko lai dinuhos','लुकाउनुहोस् र अर्कोलाई दिनुहोस्'], done:['Sabai le heryo, chhalfal suru!','सबैले हेरे, छलफल सुरु!'],
  disc:['Chhalfal','छलफल'], first:['{n} le suru garnuhos','{n}ले सुरु गर्नुहोस्'],
  help:['Palo palo shabda ko bare ek kura bhannuhos. Imposter lai chinnuhos!','पालैपालो शब्दबारे एउटा कुरा भन्नुहोस्। इम्पोस्टरलाई चिन्नुहोस्!'],
  up:['Samaya sakiyo! Vote garnuhos 🗳️','समय सकियो! भोट गर्नुहोस् 🗳️'], vote:['Vote bhayo, Imposter Dekhaunuhos','भोट भयो, इम्पोस्टर देखाउनुहोस्'],
  was:['Imposter thiyo','इम्पोस्टर थियो'], word:['Shabda thiyo','शब्द थियो'],
  under:['Undercover mode (imposter lai arkai shabda)','अन्डरकभर मोड (इम्पोस्टरलाई अर्कै शब्द)'], all:['Sabai','सबै'], nextpg:['Arko','अर्को'], back:['Pachhadi','पछाडि'], setup:['Khel Milaunuhos','खेल मिलाउनुहोस्'],
  dare:['Haarne lai sajaya','हार्नेलाई सजाय'],
  load:[['Imposter khojdai...','इम्पोस्टर खोज्दै...'],['Shabda milaudai...','शब्द मिलाउँदै...'],['Chiya pakdai...','चिया पाक्दै...'],['Popcorn tayar gardai...','पपकर्न तयार गर्दै...']],
  again:['Feri Khelnuhos','फेरि खेल्नुहोस्'], home:['Suru ma Jaanuhos','सुरुमा जानुहोस्'], quit:['Khel chhodnuhunchha?','खेल छोड्नुहुन्छ?']
};
const store = { get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const S = Object.assign({lang:0,n:4,imp:1,time:3,cats:Object.keys(CATS),names:[],hint:true,clue:true,under:false}, store.get('cfg',{}));
// auto-select categories added since the last launch
S.cats = [...new Set([...S.cats.filter(k => CATS[k]), ...Object.keys(CATS).filter(k => !(S.seen||[]).includes(k))])];
S.seen = Object.keys(CATS);
let G = null, tick = null, pg = 1;
const intro = new Audio('intro.mp3');
const app = document.getElementById('app');
const t = (k,n) => T[k][S.lang].replace('{n}', n);
const L = pair => pair[S.lang];
const other = pair => pair[1-S.lang];
const nameOf = i => (S.names[i]||'').trim() || t('p') + ' ' + (i+1);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => store.set('cfg', S);
const rnd = n => Math.floor(Math.random()*n);
const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

// Weighted pick: seats that were imposter recently are less likely (weight = rounds since, capped at 4).
function pickImps(){
  const since = store.get('since', []), imps = new Set(), age = i => since[i] ?? 4;
  while (imps.size < S.imp) {
    const w = Array.from({length:S.n}, (_,i) => imps.has(i) ? 0 : Math.min(age(i), 4));
    let r = Math.random() * w.reduce((a,b) => a+b), k = w.findIndex(x => (r -= x) < 0);
    imps.add(k < 0 ? w.findLastIndex(x => x > 0) : k);
  }
  store.set('since', Array.from({length:S.n}, (_,i) => imps.has(i) ? 1 : age(i)+1));
  return imps;
}

function splash(){
  app.innerHTML = `<div id="splash"><img class="logo" src="logo.jpeg" alt="Imposter Ko Ho?"><div class="bar"><i></i></div><p class="sub">${L(T.load[rnd(T.load.length)])}</p></div>`;
  let done = false;
  const go = () => { if (done) return; done = true; app.onclick = null; intro.pause(); document.getElementById('splash').style.opacity = 0; setTimeout(() => home(), 400); };
  intro.onended = go; app.onclick = go; // tap to skip
  intro.play().then(() => setTimeout(go, 7500), () => setTimeout(go, 2500));
}

// Page 1: players, imposters, names. Page 2: categories, time, options.
function stepper(k, lim, page){
  app.querySelector(`[data-s="${k}"]`).onclick = e => {
    const d = +e.target.dataset.d; if (!d) return;
    S[k] = Math.min(lim[1], Math.max(lim[0], S[k]+d)); save(); page();
  };
}
const stepRow = (k, label) => `<div class="row">${label}<div class="step" data-s="${k}"><button data-d="-1">−</button><b>${S[k]}</b><button data-d="1">+</button></div></div>`;
const steps = n => `<div class="dots">${[1,2].map(k=>`<span class="${k<=n?'on':''}"></span>`).join('')}</div>`;

function home(){
  clearInterval(tick); G = null; pg = 1;
  const maxImp = Math.max(1, Math.floor((S.n-1)/2));
  S.imp = Math.min(S.imp, maxImp);
  app.innerHTML = `
  <div class="top">${steps(1)}<div class="seg"><button data-l="0" class="${S.lang?'':'on'}">Roman</button><button data-l="1" class="${S.lang?'on':''}">नेपाली</button></div></div>
  <h1>${t('title')}</h1><p class="sub">${t('tag')}</p>
  <div class="box">${stepRow('n', '👥 '+t('players'))}${stepRow('imp', '🕵️ '+t('imps'))}</div>
  <h2>${t('names')}</h2>
  <div class="names">${Array.from({length:S.n},(_,i)=>`<input data-i="${i}" maxlength="14" placeholder="${t('p')} ${i+1}" value="${esc(S.names[i]||'')}">`).join('')}</div>
  <button class="btn alt" id="go">${t('nextpg')} ▶</button>`;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lang=+b.dataset.l;save();home()});
  stepper('n', [3,15], home); stepper('imp', [1,maxImp], home);
  app.querySelectorAll('[data-i]').forEach(inp=>inp.oninput=()=>{S.names[+inp.dataset.i]=inp.value;save()});
  document.getElementById('go').onclick = () => setup();
}

function setup(err=''){
  pg = 2;
  app.innerHTML = `
  <div class="top"><button class="seg-b" id="bk">◀ ${t('back')}</button>${steps(2)}</div>
  <h1>${t('setup')}</h1><p class="sub">👥 ${S.n} · 🕵️ ${S.imp}</p>
  <div class="row"><h2>${t('cats')}</h2><button class="seg-b" id="all">${t('all')} ✓</button></div>
  <div class="chips">${Object.entries(CATS).map(([k,c])=>`<button class="chip ${S.cats.includes(k)?'on':''}" data-c="${k}"><i>${c.i}</i>${L(c.n)}</button>`).join('')}</div>
  <div class="box">
    ${stepRow('time', '⏱️ '+t('time'))}
    <label class="tog">${t('hint')}<input type="checkbox" id="hint" ${S.hint?'checked':''}></label>
    <label class="tog">${t('clue')}<input type="checkbox" id="clue" ${S.clue?'checked':''}></label>
    <label class="tog">${t('under')}<input type="checkbox" id="under" ${S.under?'checked':''}></label>
  </div>
  <p class="err">${err}</p>
  <button class="btn" id="go">${t('start')} ▶</button>`;
  stepper('time', [1,10], setup);
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.c; S.cats=S.cats.includes(k)?S.cats.filter(x=>x!==k):[...S.cats,k]; save(); b.classList.toggle('on');
  });
  ['hint','clue','under'].forEach(k=>document.getElementById(k).onchange=e=>{S[k]=e.target.checked;save()});
  document.getElementById('all').onclick=()=>{S.cats=S.cats.length===Object.keys(CATS).length?[]:Object.keys(CATS);save();setup()};
  document.getElementById('bk').onclick = () => home();
  document.getElementById('go').onclick=()=>S.cats.length?newRound():setup(t('pick'));
}

function newRound(){
  intro.pause();
  const ck = S.cats[rnd(S.cats.length)], cat = CATS[ck];
  const imps = pickImps();
  const used = store.get('used', []).filter(w => cat.w.some(x => x[0]===w));
  let pool = cat.w.filter(x => !used.includes(x[0])); if (!pool.length) { pool = cat.w; used.length = 0; }
  const word = pool[rnd(pool.length)]; used.push(word[0]); store.set('used', used.slice(-200));
  const rest = cat.w.filter(x => x !== word);
  G = {cat, word, decoy: S.under ? rest[rnd(rest.length)] : null, imps, i:0, first:rnd(S.n)};
  reveal();
}

function reveal(){
  const i = G.i, last = i===S.n-1, isImp = G.imps.has(i) && !G.decoy, w = G.imps.has(i) && G.decoy ? G.decoy : G.word;
  app.innerHTML = `
  <div class="dots">${Array.from({length:S.n},(_,k)=>`<span class="${k<=i?'on':''}"></span>`).join('')}</div>
  <div class="grow">
    <p class="big">${t('pass', esc(nameOf(i)))}</p>
    <div class="flip" id="card"><div>
      <div class="face front"><div class="q">❓</div><b style="font-size:22px" id="lb">${t('tap')}</b><span class="sub">${t('only')}</span></div>
      <div class="face back ${isImp?'imp':''}">${isImp
        ? `<div style="font-size:70px">🕵️</div><div class="word">${t('you')}</div>${S.hint?`<span class="pill">${t('cat')}: ${G.cat.i} ${L(G.cat.n)}</span>`:''}${S.clue&&HINTS[G.word[0]]?`<span class="pill" style="background:var(--gold);color:#000">💡 ${t('cl')}: ${HINTS[G.word[0]]}</span>`:''}<span class="sub">${t('blend')}</span>`
        : `<h2>${t('your')}</h2><div class="word">${L(w)}<small>${other(w)}</small></div><span class="pill">${G.cat.i} ${L(G.cat.n)}</span>`}
      </div>
    </div></div>
    <button class="btn alt" id="nx" style="visibility:hidden">${last?t('done'):t('next')}</button>
  </div>`;
  const card = document.getElementById('card'), nx = document.getElementById('nx');
  // hold to see, once only: release hides it for good and hands over to the next player
  let seen = false;
  card.onpointerdown = e => { if (seen) return; e.preventDefault(); card.classList.add('open'); buzz(isImp?[60,60,60]:40); };
  const hide = () => { if (seen || !card.classList.contains('open')) return; seen = true; card.classList.remove('open'); document.getElementById('lb').textContent = t('seen'); nx.style.visibility='visible'; };
  card.onpointerup = card.onpointercancel = card.onpointerleave = hide;
  card.oncontextmenu = e => e.preventDefault();
  nx.onclick = () => { if(last) discuss(); else {G.i++; reveal();} };
}

function discuss(){
  let left = S.time*60;
  app.innerHTML = `
  <div class="grow">
    <h2>${t('disc')}</h2>
    <p class="big">🎤 ${t('first', esc(nameOf(G.first)))}</p>
    <p class="sub">${t('help')}</p>
    <div class="timer" id="tm"></div>
    <p class="err" id="up"></p>
  </div>
  <button class="btn" id="rv">${t('vote')}</button>`;
  const tm = document.getElementById('tm');
  const draw = () => { tm.textContent = Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); tm.classList.toggle('low', left<=10); };
  draw();
  tick = setInterval(()=>{ left--; draw(); if(left<=0){ clearInterval(tick); buzz([300,100,300]); document.getElementById('up').textContent=t('up'); } }, 1000);
  document.getElementById('rv').onclick = result;
}

function result(){
  clearInterval(tick);
  app.innerHTML = `
  <div class="grow">
    <div style="font-size:80px">🕵️</div>
    <h2>${t('was')}</h2>
    <div>${[...G.imps].map(i=>`<span class="pill r" style="font-size:22px">${esc(nameOf(i))}</span>`).join('')}</div>
    <h2>${t('word')}</h2>
    <div class="word">${L(G.word)}<small>${other(G.word)}</small></div>
    ${G.decoy?`<span class="sub">Imposter: ${L(G.decoy)} / ${other(G.decoy)}</span>`:''}
    <span class="pill">${G.cat.i} ${L(G.cat.n)}</span>
    <div class="box" style="width:100%"><h2>🔥 ${t('dare')}</h2><b style="font-size:18px">${L(DARES[rnd(DARES.length)])}</b></div>
  </div>
  <button class="btn" id="ag">${t('again')} 🔁</button>
  <button class="btn ghost" id="hm">${t('home')}</button>`;
  document.getElementById('ag').onclick = newRound;
  document.getElementById('hm').onclick = () => home();
}

// Called by Android back button; return true if handled.
window.goBack = () => { if(!G){ if(pg===2){ home(); return true; } return false; } if(confirm(t('quit'))) home(); return true; };
save(); splash();
</script>
</body>
</html>
