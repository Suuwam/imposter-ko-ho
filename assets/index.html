<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Imposter Ko Ho?</title>
<style>
:root{--txt:#14162b;--mut:#62667f;--red:#d42a45;--green:#169a5e;--ink:#17192e;--glass:rgba(255,255,255,.52);--edge:rgba(255,255,255,.85);--shade:0 1px 0 rgba(255,255,255,.9) inset,0 12px 32px rgba(23,25,46,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;color:var(--txt);font-family:system-ui,"Noto Sans Devanagari",sans-serif;-webkit-font-smoothing:antialiased}
body{background:#eef0f6;background-image:radial-gradient(55% 35% at 0% 0%,#ffd9df,transparent 70%),radial-gradient(50% 35% at 100% 35%,#d9e3ff,transparent 70%),radial-gradient(60% 40% at 30% 100%,#d4f3e3,transparent 70%);background-attachment:fixed}
#app{min-height:100%;max-width:520px;margin:0 auto;padding:22px 16px 28px;display:flex;flex-direction:column;gap:16px}
.glass,.box,.seg,.chip,.names input,.step button,.seg-b,.back{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--edge);box-shadow:var(--shade)}
h1{margin:6px 0 0;font-size:30px;line-height:1.15;text-align:center;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--red)}
h2{margin:0;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.sub{text-align:center;color:var(--mut);margin:0;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.seg{display:flex;border-radius:99px;padding:3px}
.seg button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px;font-weight:700}
.seg button.on{background:#d9dce6;color:var(--txt);box-shadow:inset 0 2px 5px rgba(23,25,46,.18)}
.box{border-radius:20px;padding:6px 16px;display:flex;flex-direction:column}
.box>*+*{border-top:1px solid rgba(23,25,46,.07)}
.row,.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:600;padding:12px 0}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:12px;color:var(--txt);font-size:20px;font-weight:600}
.step b{min-width:34px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border-radius:16px;padding:14px 12px;font:inherit;font-weight:600;font-size:15px;text-align:left;color:var(--txt);display:flex;align-items:center;gap:10px}
.chip i{font-style:normal;font-size:20px}
.chip.on{background:#d9dce6;border-color:rgba(23,25,46,.12);box-shadow:inset 0 2px 6px rgba(23,25,46,.18)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names input{width:100%;padding:14px 12px;border-radius:14px;color:var(--txt);font:inherit;font-size:16px;user-select:text;outline:none}
.names input:focus{border-color:var(--ink)}
.tog input{width:22px;height:22px;accent-color:var(--ink)}
.btn{border:0;border-radius:18px;padding:18px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--red);box-shadow:0 10px 24px rgba(212,42,69,.28);width:100%;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--ink);box-shadow:0 10px 24px rgba(23,25,46,.22)}
.btn.ghost{background:var(--glass);box-shadow:none;border:1px solid var(--edge);color:var(--mut);font-size:15px;padding:14px}
.grow{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.big{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.flip{width:100%;perspective:1000px;height:340px;touch-action:none;-webkit-touch-callout:none}
.flip>div{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.open>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.front{color:#fff;background:linear-gradient(160deg,#22b874,var(--green));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 18px 40px rgba(22,154,94,.3);transition:background .3s,box-shadow .3s}
.flip.seen .front{background:linear-gradient(160deg,#e8475f,var(--red));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 18px 40px rgba(212,42,69,.3)}
.front b{font-size:20px;font-weight:700}
.front span{font-size:14px;opacity:.85}
.ring{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:34px;font-weight:300}
.back{transform:rotateY(180deg)}
.back.imp{background:linear-gradient(160deg,#ef4a5f,#c81e3a);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:0 18px 40px rgba(212,42,69,.35)}
.back.imp h2,.back.imp .pill{color:#fff}
.word{font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.word small{display:block;font-size:18px;color:var(--mut);font-weight:600;margin-top:6px}
.pill{display:block;font-weight:600;font-size:15px;color:var(--mut)}
.back.imp .pill{color:rgba(255,255,255,.88)}
.pill.r{color:var(--red);font-weight:800}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots span{width:8px;height:8px;border-radius:50%;background:rgba(23,25,46,.15)}
.dots span.on{background:var(--ink)}
.top .dots span{width:24px;height:6px;border-radius:99px}
.seg-b{color:var(--txt);border-radius:99px;padding:8px 14px;font:inherit;font-weight:600;font-size:14px}
#splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .4s}
#splash .logo{width:min(70vw,300px);aspect-ratio:1;border-radius:50%;box-shadow:0 20px 50px rgba(23,25,46,.18);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:scale(.92)}}
.bar{width:56%;height:4px;border-radius:99px;background:rgba(23,25,46,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;animation:fill 6s linear forwards}
@keyframes fill{to{width:100%}}
.err{color:var(--red);text-align:center;font-weight:600;min-height:1em;margin:0;font-size:14px}
</style>
</head>

  ['Shah Rukh jasto haat failaera pose dinuhos','शाहरुख जस्तै हात फैलाएर पोज दिनुहोस्'],['Pushpa jasto daari musarnuhos: "Jhukega nahi!"','पुष्पा जस्तै दाह्री मुसार्नुहोस्: "झुकेगा नहीं!"'],
  ['Slow motion ma hidera entry garnuhos','स्लो मोसनमा हिँडेर इन्ट्री गर्नुहोस्'],['15 second English ma bhashan dinuhos','१५ सेकेन्ड अङ्ग्रेजीमा भाषण दिनुहोस्'],
  ['Jethalal jasto "Nonsense!" bhannuhos','जेठालाल जस्तै "नन्सेन्स!" भन्नुहोस्']
];
const T = {
  title:['Imposter <span>Ko Ho?</span>','इम्पोस्टर <span>को हो?</span>'],
  players:['Kheladi','खेलाडी'], imps:['Imposter','इम्पोस्टर'],
  cats:['Bishaya','विषय'], names:['Kheladi ko naam','खेलाडीको नाम'], hint:['Imposter lai bishaya dekhaunuhos','इम्पोस्टरलाई विषय देखाउनुहोस्'], clue:['Imposter lai close hint dinuhos','इम्पोस्टरलाई नजिकको हिन्ट दिनुहोस्'], cl:['Hint','हिन्ट'],
  start:['Khel Suru Garnuhos','खेल सुरु गर्नुहोस्'], pick:['Kamti ma ek bishaya chhannuhos!','कम्तीमा एउटा विषय छान्नुहोस्!'],
  p:['Kheladi','खेलाडी'], pass:['Phone {n} lai dinuhos','फोन {n}लाई दिनुहोस्'], tap:['Herna thichirakhnuhos','हेर्न थिचिराख्नुहोस्'], seen:['Herisaknu bhayo','हेरिसक्नुभयो'], again2:['Feri herna thichirakhnuhos','फेरि हेर्न थिचिराख्नुहोस्'],
  your:['Tapai ko shabda','तपाईंको शब्द'],
  you:['Tapai Imposter Hunuhunchha!','तपाईं इम्पोस्टर हुनुहुन्छ!'],
  cat:['Bishaya','विषय'], next:['Lukaunuhos ra arko lai dinuhos','लुकाउनुहोस् र अर्कोलाई दिनुहोस्'], done:['Sabai le heryo, chhalfal suru!','सबैले हेरे, छलफल सुरु!'],
  disc:['Chhalfal','छलफल'], first:['{n} le suru garnuhos','{n}ले सुरु गर्नुहोस्'],
  vote:['Vote bhayo, Imposter Dekhaunuhos','भोट भयो, इम्पोस्टर देखाउनुहोस्'],
  was:['Imposter thiyo','इम्पोस्टर थियो'], word:['Shabda thiyo','शब्द थियो'],
  under:['Undercover mode (imposter lai arkai shabda)','अन्डरकभर मोड (इम्पोस्टरलाई अर्कै शब्द)'], all:['Sabai','सबै'], nextpg:['Arko','अर्को'], back:['Pachhadi','पछाडि'], setup:['Khel Milaunuhos','खेल मिलाउनुहोस्'],
  dare:['Haarne lai sajaya','हार्नेलाई सजाय'],
  again:['Feri Khelnuhos','फेरि खेल्नुहोस्'], home:['Suru ma Jaanuhos','सुरुमा जानुहोस्'], quit:['Khel chhodnuhunchha?','खेल छोड्नुहुन्छ?']
};
const store = { get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const S = Object.assign({lang:0,n:4,imp:1,time:3,cats:Object.keys(CATS),names:[],hint:true,clue:true,under:false}, store.get('cfg',{}));
// auto-select categories added since the last launch
S.cats = [...new Set([...S.cats.filter(k => CATS[k]), ...Object.keys(CATS).filter(k => !(S.seen||[]).includes(k))])];
S.seen = Object.keys(CATS);
let G = null, pg = 1;
const intro = new Audio('intro.mp3');
const app = document.getElementById('app');
const t = (k,n) => T[k][S.lang].replace('{n}', n);
const L = pair => pair[S.lang];
const other = pair => pair[1-S.lang];
const nameOf = i => (S.names[i]||'').trim() || t('p') + ' ' + (i+1);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => store.set('cfg', S);
const rnd = n => Math.floor(Math.random()*n);
const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

// Weighted pick: seats that were imposter recently are less likely (weight = rounds since, capped at 4).
function pickImps(){
  const since = store.get('since', []), imps = new Set(), age = i => since[i] ?? 4;
  while (imps.size < S.imp) {
    const w = Array.from({length:S.n}, (_,i) => imps.has(i) ? 0 : Math.min(age(i), 4));
    let r = Math.random() * w.reduce((a,b) => a+b), k = w.findIndex(x => (r -= x) < 0);
    imps.add(k < 0 ? w.findLastIndex(x => x > 0) : k);
  }
  store.set('since', Array.from({length:S.n}, (_,i) => imps.has(i) ? 1 : age(i)+1));
  return imps;
}

function splash(){
  app.innerHTML = `<div id="splash"><img class="logo" src="logo.jpeg" alt="Imposter Ko Ho?"><h1>${t('title')}</h1><div class="bar"><i></i></div></div>`;
  let done = false;
  const go = () => { if (done) return; done = true; app.onclick = null; intro.pause(); document.getElementById('splash').style.opacity = 0; setTimeout(() => home(), 400); };
  intro.onended = go; app.onclick = go; // tap to skip
  const fit = () => document.querySelector('.bar i').style.animationDuration = intro.duration + 's'; // bar tracks full sound
  intro.readyState ? fit() : intro.onloadedmetadata = fit;
  intro.play().catch(() => setTimeout(go, 2500));
}

// Page 1: players, imposters, names, options. Page 2: categories.
function stepper(k, lim, page){
  app.querySelector(`[data-s="${k}"]`).onclick = e => {
    const d = +e.target.dataset.d; if (!d) return;
    S[k] = Math.min(lim[1], Math.max(lim[0], S[k]+d)); save(); page();
  };
}
const stepRow = (k, label) => `<div class="row">${label}<div class="step" data-s="${k}"><button data-d="-1">−</button><b>${S[k]}</b><button data-d="1">+</button></div></div>`;
const steps = n => `<div class="dots">${[1,2].map(k=>`<span class="${k<=n?'on':''}"></span>`).join('')}</div>`;

function home(){
  G = null; pg = 1;
  const maxImp = Math.max(1, Math.floor((S.n-1)/2));
  S.imp = Math.min(S.imp, maxImp);
  app.innerHTML = `
  <div class="top">${steps(1)}<div class="seg"><button data-l="0" class="${S.lang?'':'on'}">Roman</button><button data-l="1" class="${S.lang?'on':''}">नेपाली</button></div></div>
  <h1>${t('title')}</h1>
  <div class="box">${stepRow('n', t('players'))}${stepRow('imp', t('imps'))}</div>
  <h2>${t('names')}</h2>
  <div class="names">${Array.from({length:S.n},(_,i)=>`<input data-i="${i}" maxlength="14" placeholder="${t('p')} ${i+1}" value="${esc(S.names[i]||'')}">`).join('')}</div>
  <div class="box">
    <label class="tog">${t('hint')}<input type="checkbox" id="hint" ${S.hint?'checked':''}></label>
    <label class="tog">${t('clue')}<input type="checkbox" id="clue" ${S.clue?'checked':''}></label>
    <label class="tog">${t('under')}<input type="checkbox" id="under" ${S.under?'checked':''}></label>
  </div>
  <button class="btn alt" id="go">${t('nextpg')}</button>`;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lang=+b.dataset.l;save();home()});
  stepper('n', [3,15], home); stepper('imp', [1,maxImp], home);
  app.querySelectorAll('[data-i]').forEach(inp=>inp.oninput=()=>{S.names[+inp.dataset.i]=inp.value;save()});
  ['hint','clue','under'].forEach(k=>document.getElementById(k).onchange=e=>{S[k]=e.target.checked;save()});
  document.getElementById('go').onclick = () => setup();
}

function setup(err=''){
  pg = 2;
  app.innerHTML = `
  <div class="top"><button class="seg-b" id="bk">‹ ${t('back')}</button>${steps(2)}</div>
  <h1>${t('setup')}</h1><p class="sub">${S.n} ${t('players')} · ${S.imp} ${t('imps')}</p>
  <div class="row"><h2>${t('cats')}</h2><button class="seg-b" id="all">${t('all')}</button></div>
  <div class="chips">${Object.entries(CATS).map(([k,c])=>`<button class="chip ${S.cats.includes(k)?'on':''}" data-c="${k}"><i>${c.i}</i>${L(c.n)}</button>`).join('')}</div>
  <p class="err">${err}</p>
  <button class="btn" id="go">${t('start')}</button>`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.c; S.cats=S.cats.includes(k)?S.cats.filter(x=>x!==k):[...S.cats,k]; save(); b.classList.toggle('on');
  });
  document.getElementById('all').onclick=()=>{S.cats=S.cats.length===Object.keys(CATS).length?[]:Object.keys(CATS);save();setup()};
  document.getElementById('bk').onclick = () => home();
  document.getElementById('go').onclick=()=>S.cats.length?newRound():setup(t('pick'));
}

function newRound(){
  intro.pause();
  const ck = S.cats[rnd(S.cats.length)], cat = CATS[ck];
  const imps = pickImps();
  const used = store.get('used', []).filter(w => cat.w.some(x => x[0]===w));
  let pool = cat.w.filter(x => !used.includes(x[0])); if (!pool.length) { pool = cat.w; used.length = 0; }
  const word = pool[rnd(pool.length)]; used.push(word[0]); store.set('used', used); // no repeats until the whole category is used
  const rest = cat.w.filter(x => x !== word);
  G = {cat, word, decoy: S.under ? rest[rnd(rest.length)] : null, imps, i:0, first:rnd(S.n)};
  reveal();
}

function reveal(){
  const i = G.i, last = i===S.n-1, isImp = G.imps.has(i) && !G.decoy, w = G.imps.has(i) && G.decoy ? G.decoy : G.word;
  app.innerHTML = `
  <div class="dots">${Array.from({length:S.n},(_,k)=>`<span class="${k<=i?'on':''}"></span>`).join('')}</div>
  <div class="grow">
    <p class="big">${t('pass', esc(nameOf(i)))}</p>
    <div class="flip" id="card"><div>
      <div class="face front"><div class="ring">?</div><b id="lb">${t('tap')}</b><span id="lb2"></span></div>
      <div class="face back ${isImp?'imp':''}">${isImp
        ? `<h2>${t('imps')}</h2><div class="word">${t('you')}</div>${S.hint?`<span class="pill">${t('cat')}: ${G.cat.i} ${L(G.cat.n)}</span>`:''}${S.clue&&(G.word[2]||HINTS[G.word[0]])?`<span class="pill">${t('cl')}: ${G.word[2]||HINTS[G.word[0]]}</span>`:''}`
        : `<h2>${t('your')}</h2><div class="word">${L(w)}<small>${other(w)}</small></div><span class="pill">${G.cat.i} ${L(G.cat.n)}</span>`}
      </div>
    </div></div>
    <button class="btn alt" id="nx" style="visibility:hidden">${last?t('done'):t('next')}</button>
  </div>`;
  const card = document.getElementById('card'), nx = document.getElementById('nx');
  // hold to see, as often as needed: card is green until first look, red after
  card.onpointerdown = e => { e.preventDefault(); card.classList.add('open'); buzz(isImp?[60,60,60]:40); };
  const hide = () => { if (!card.classList.contains('open')) return; card.classList.remove('open'); card.classList.add('seen'); document.getElementById('lb').textContent = t('seen'); document.getElementById('lb2').textContent = t('again2'); nx.style.visibility='visible'; };
  card.onpointerup = card.onpointercancel = card.onpointerleave = hide;
  card.oncontextmenu = e => e.preventDefault();
  nx.onclick = () => { if(last) discuss(); else {G.i++; reveal();} };
}

function discuss(){
  app.innerHTML = `
  <div class="grow">
    <h2>${t('disc')}</h2>
    <p class="big">${t('first', esc(nameOf(G.first)))}</p>
  </div>
  <button class="btn" id="rv">${t('vote')}</button>`;
  document.getElementById('rv').onclick = result;
}

function result(){
  app.innerHTML = `
  <div class="grow">
    <h2>${t('was')}</h2>
    <div>${[...G.imps].map(i=>`<span class="pill r" style="font-size:22px">${esc(nameOf(i))}</span>`).join('')}</div>
    <h2>${t('word')}</h2>
    <div class="word">${L(G.word)}<small>${other(G.word)}</small></div>
    ${G.decoy?`<span class="sub">Imposter: ${L(G.decoy)} / ${other(G.decoy)}</span>`:''}
    <span class="pill">${G.cat.i} ${L(G.cat.n)}</span>
    <div class="box" style="width:100%;padding:16px;gap:8px"><h2>${t('dare')}</h2><b style="font-size:18px;border:0">${L(DARES[rnd(DARES.length)])}</b></div>
  </div>
  <button class="btn" id="ag">${t('again')}</button>
  <button class="btn ghost" id="hm">${t('home')}</button>`;
  document.getElementById('ag').onclick = newRound;
  document.getElementById('hm').onclick = () => home();
}

// Called by Android back button; return true if handled.
window.goBack = () => { if(!G){ if(pg===2){ home(); return true; } return false; } if(confirm(t('quit'))) home(); return true; };
save(); splash();
</script>
</body>
</html>
